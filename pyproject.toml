[project]
name = "quantlab"
version = "0.0.1"
description = "AI Quant Lab — LLM/ML-driven quant strategy research for KRX (backtest-only MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",       # parquet cache
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Live KRX data sources — kept optional so the package imports (and tests run)
# without network access or these heavier deps installed.
data = [
    "pykrx>=1.0.45",
    "finance-datareader>=0.9.50",
]
# ML stack (used from M3 onwards).
ml = [
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
]
# LLM strategy generation (M2). Optional so the DSL/parser work offline.
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
